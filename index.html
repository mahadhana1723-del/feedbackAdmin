<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LR Team Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; }
        .dashboard-card { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; }
    </style>
</head>
<body class="pb-20">

    <div class="dashboard-card shadow-2xl border-b-4 border-blue-500 pb-8 pt-6 px-4">
        <div class="max-w-6xl mx-auto">
            
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold tracking-wide flex items-center">
                    <i class="fa-solid fa-chart-pie text-blue-400 mr-3"></i> 
                    LR TEAM ANALYTICS
                </h1>
                <div class="text-right">
                    <span class="text-xs text-gray-300 uppercase tracking-widest block">Total Submissions</span>
                    <span class="text-3xl font-bold text-white" id="totalCount">0</span>
                </div>
            </div>

            <div class="bg-white/10 backdrop-blur-md rounded-xl p-6 border border-white/10">
                <h3 class="text-xs font-bold text-blue-200 uppercase tracking-widest mb-4 border-b border-white/10 pb-2">
                    Average Ratings per Category (Out of 5)
                </h3>
                
                <div id="averagesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-4 text-sm">
                    <div class="col-span-full text-center text-blue-200 py-4">Loading stats...</div>
                </div>

                <div class="mt-6 pt-4 border-t border-white/20 flex items-center justify-between">
                    <div>
                        <p class="text-yellow-400 font-bold uppercase tracking-widest text-xs">Overall Team Rating</p>
                        <p class="text-gray-300 text-xs mt-1">Overall average of all 9 metrics from all users</p>
                    </div>
                    <div class="flex items-center gap-3 bg-white/10 px-4 py-2 rounded-lg border border-yellow-500/30 shadow-inner">
                        <span class="text-4xl font-bold text-white" id="globalOverall">0.0</span>
                        <div class="text-yellow-400 text-sm">
                            <i class="fa-solid fa-star"></i>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="max-w-5xl mx-auto px-4 mt-8">
        <h3 class="text-gray-500 font-bold uppercase text-xs tracking-widest mb-4 ml-1">Recent Detailed Submissions</h3>
        
        <div id="loading" class="text-center py-10">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl text-blue-600 mb-2"></i>
            <p class="text-gray-500 text-sm">Syncing Data...</p>
        </div>

        <div id="feedbackList" class="flex flex-col gap-6 hidden"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCpEMtX1eP7YwZDH0qLBRGci6VkhBgcJVo",
            authDomain: "feedback-4ace7.firebaseapp.com",
            projectId: "feedback-4ace7",
            storageBucket: "feedback-4ace7.firebasestorage.app",
            messagingSenderId: "331705524032",
            appId: "1:331705524032:web:7e8d046e71984f74a6e4a5",
            measurementId: "G-0WL2N0YFQ1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Labels for the 9 rated questions
        const questionLabels = {
            q1: "1. Crew Utilisation",
            q2: "2. Adjustments & Obligations",
            q3: "3. Approachability",
            q4: "4. Requests Handling",
            q5: "5. Seniority Management", 
            q6: "6. Coordination With crew & TLC/PRC",
            q7: "7. Emergencies Handling with less disturbances",
            q8: "8. Maintaining LR & Handling",
            q9: "9. Way of communicating"
        };

        // Querying the NEW collection "lr_feedbacks"
        const q = query(collection(db, "lr_feedbacks"), orderBy("date", "desc"));

        onSnapshot(q, (snapshot) => {
            const list = document.getElementById('feedbackList');
            const avgGrid = document.getElementById('averagesGrid');
            const globalOverallDisplay = document.getElementById('globalOverall');
            const totalCountDisplay = document.getElementById('totalCount');
            const loading = document.getElementById('loading');

            loading.classList.add('hidden');
            list.classList.remove('hidden');
            
            list.innerHTML = ""; 
            avgGrid.innerHTML = "";

            if(snapshot.empty) {
                list.innerHTML = `<div class="text-center py-10 text-gray-400">No feedback submitted yet.</div>`;
                return;
            }

            // Stats object for 9 questions
            let stats = {};
            for(let i=1; i<=9; i++) {
                stats[`q${i}`] = { sum: 0, count: 0 };
            }

            let globalSum = 0;
            let globalCount = 0;

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;

                let personSum = 0;
                let personCount = 0;

                // Process Q1 to Q9 (Ratings)
                for(let i=1; i<=9; i++) {
                    if(data[`q${i}`] && typeof data[`q${i}`] === 'number') {
                        let val = data[`q${i}`];
                        stats[`q${i}`].sum += val;
                        stats[`q${i}`].count++;
                        
                        personSum += val;
                        personCount++;

                        globalSum += val;
                        globalCount++;
                    }
                }

                // Average for this specific person
                const personAvg = personCount > 0 ? (personSum / personCount).toFixed(1) : "0.0";
                
                // Color Logic based on average
                let scoreColor = "text-blue-600 bg-blue-50 border-blue-200";
                if(personAvg >= 4) scoreColor = "text-green-600 bg-green-50 border-green-200";
                if(personAvg <= 2.5) scoreColor = "text-red-600 bg-red-50 border-red-200";

                let dateStr = data.date ? new Date(data.date.seconds * 1000).toLocaleString('en-IN', { 
                        month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' 
                    }) : "Just now";

                // Suggestions/Complaints Text (Q10)
                let descText = data.q10 || "No suggestions/complaints provided.";

                // Generate Card
                const card = `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition">
                        
                        <div class="bg-gray-50 px-4 py-2 flex justify-between items-center border-b border-gray-100">
                            <span class="text-xs font-mono text-gray-500 font-bold">ID: #${id.slice(-5).toUpperCase()}</span>
                            <div class="flex items-center gap-3">
                                <span class="text-xs text-gray-500 font-medium"><i class="fa-regular fa-clock mr-1"></i> ${dateStr}</span>
                                <button onclick="window.deleteFeedback('${id}')" class="text-gray-300 hover:text-red-500 transition text-sm" title="Delete record">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>

                        <div class="p-5 flex flex-col sm:flex-row gap-6">
                            
                            <div class="w-full sm:w-40 flex flex-col items-center justify-center border-b sm:border-b-0 sm:border-r border-gray-100 pb-4 sm:pb-0">
                                <span class="text-[0.65rem] text-gray-400 uppercase font-bold tracking-wider block mb-2">User's Average</span>
                                <div class="w-20 h-20 mx-auto rounded-full border-4 ${scoreColor} flex items-center justify-center bg-white shadow-sm">
                                    <span class="text-3xl font-bold ${scoreColor.split(' ')[0]}">${personAvg}</span>
                                </div>
                            </div>

                            <div class="flex-1">
                                <h4 class="text-xs font-bold text-blue-900 uppercase mb-2 flex items-center gap-2">
                                    <i class="fa-solid fa-comment-dots text-blue-500"></i> Suggestions & Complaints (Q10)
                                </h4>
                                <div class="bg-blue-50/50 p-4 rounded-lg border border-blue-100 text-sm text-gray-700 whitespace-pre-wrap leading-relaxed">${descText}</div>
                            </div>
                        </div>
                    </div>
                `;
                list.innerHTML += card;
            });

            // Update Global Stats
            totalCountDisplay.innerText = snapshot.size;

            // Generate Grid Items for Q1-Q9
            for(let i=1; i<=9; i++) {
                let key = `q${i}`;
                let avg = stats[key].count > 0 ? (stats[key].sum / stats[key].count).toFixed(1) : "0.0";
                let percent = (avg / 5) * 100;
                
                // Bar color logic
                let colorClass = avg >= 4 ? "bg-green-400" : (avg <= 2.5 ? "bg-red-400" : "bg-yellow-400");
                
                let html = `
                    <div class="bg-white/5 p-3 rounded-lg border border-white/10 hover:bg-white/10 transition">
                        <div class="flex justify-between mb-2">
                            <span class="text-gray-300 text-xs font-medium truncate pr-2" title="${questionLabels[key]}">${questionLabels[key]}</span>
                            <span class="font-bold text-white text-xs">${avg} <i class="fa-solid fa-star text-[0.6rem] text-yellow-500"></i></span>
                        </div>
                        <div class="w-full bg-black/40 rounded-full h-2 shadow-inner">
                            <div class="${colorClass} h-2 rounded-full shadow" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
                avgGrid.innerHTML += html;
            }

            // Global Overall Rating
            let gAvg = globalCount > 0 ? (globalSum / globalCount).toFixed(1) : "0.0";
            globalOverallDisplay.innerText = gAvg;

        });

        // Delete function targets the new collection
        window.deleteFeedback = async (id) => {
            if(confirm("Delete this feedback permanently?")) {
                try { await deleteDoc(doc(db, "lr_feedbacks", id)); } 
                catch(e) { alert("Error: " + e.message); }
            }
        }
    </script>
</body>
</html>
